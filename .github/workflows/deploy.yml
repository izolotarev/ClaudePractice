name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # Deploy the exact commit that passed the tests. The hook URL is a secret: never echo it.
          curl --fail --silent --show-error --output /dev/null -X POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}"
          echo "Deploy requested for ${GITHUB_SHA}"

      - name: Smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Render needs a few minutes to build and restart, so retry for up to 10 minutes.
          for i in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 10 "${APP_URL}/api/health" | grep -q '"status":"ok"'; then
              echo "Health check passed on attempt ${i}"
              exit 0
            fi
            echo "Attempt ${i}: not healthy yet"
            sleep 15
          done
          echo "Health check failed after 10 minutes"
          exit 1
